<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Scanner</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:30px;
}

#status{
    font-size:42px;
    font-weight:bold;
    color:#555;
    margin-top:30px;
}

button{
    padding:12px 22px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
}

.approved{
    color:green;
}

.declined{
    color:red;
}
</style>
</head>

<body>

<div class="container">

<button onclick="toggleFullscreen()" style="width:100%;font-size:18px;">
⛶ Full Screen
</button>

<h1>Place card over camera</h1>

<div id="status">
Ready to scan
</div>

<button onclick="scanCard()">Scan</button>

</div>

<script>

function scanCard(){

    const status=document.getElementById("status");

    status.className="";
    status.innerHTML="Scanning...";

    setTimeout(()=>{

        if(Math.random()<0.8){

            status.className="approved";
            status.innerHTML="✔ CARD APPROVED";

        }else{

            status.className="declined";
            status.innerHTML="✖ CARD DECLINED";

        }

    },1500);

}

function toggleFullscreen(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen().catch(()=>{
            alert("Fullscreen is not supported on this device.");
        });

    }else{

        document.exitFullscreen();

    }

}

</script>

</body>
</html>
