<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Scanner</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:30px;
}

#status{
    font-size:42px;
    font-weight:bold;
    color:#555;
    margin-top:30px;
}

button{
    padding:12px 22px;
    font-size:18px;
    cursor:pointer;
    margin:10px;
}

.approved{
    color:green;
}

.declined{
    color:red;
}

/* Hidden camera */
#camera{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="container">

<button onclick="toggleFullscreen()" style="width:100%;font-size:18px;">
⛶ Full Screen
</button>

<h1>Please scan your card</h1>

<video id="camera" autoplay playsinline muted></video>

<div id="status">
Waiting for card...
</div>

<button onclick="scanAgain()">Scan Again</button>

</div>

<script>

const video=document.getElementById("camera");
const status=document.getElementById("status");

let scanning=true;
let previousBrightness=0;

// Start FRONT camera
navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"user"
    },
    audio:false
})
.then(stream=>{
    video.srcObject=stream;
})
.catch(err=>{
    status.innerHTML="Camera permission denied";
    console.log(err);
});

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

setInterval(()=>{

    if(!scanning) return;

    if(video.readyState!==4) return;

    canvas.width=160;
    canvas.height=120;

    ctx.drawImage(video,0,0,160,120);

    const pixels=ctx.getImageData(0,0,160,120).data;

    let total=0;

    for(let i=0;i<pixels.length;i+=4){
        total+=pixels[i]+pixels[i+1]+pixels[i+2];
    }

    const brightness=total/(pixels.length/4);

    if(Math.abs(brightness-previousBrightness)>12){

        scanning=false;

        if(Math.random()<0.8){

            status.className="approved";
            status.innerHTML="✔ CARD APPROVED";

        }else{

            status.className="declined";
            status.innerHTML="✖ CARD DECLINED";

        }

    }

    previousBrightness=brightness;

},200);

function scanAgain(){

    scanning=true;
    previousBrightness=0;

    status.className="";
    status.innerHTML="Waiting for card...";

}

function toggleFullscreen(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen().catch(()=>{
            alert("Fullscreen is not supported on this device.");
        });

    }else{

        document.exitFullscreen();

    }

}

</script>

</body>
</html>
